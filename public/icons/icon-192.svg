<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.76" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42.24" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="96" cy="96" r="86.4" fill="none" stroke="url(#brandGrad)" stroke-width="7.68" stroke-dasharray="28.799999999999997 15.36" opacity="0.8"/>

  <!-- Core Brain / Memory Node Graphics -->
  <g transform="translate(96, 96) scale(0.375)" filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="48" fill="url(#brandGrad)"/>
    <circle cx="0" cy="0" r="24" fill="#ffffff" opacity="0.9"/>
    
    <!-- Connected Orbit Nodes -->
    <g stroke="url(#brandGrad)" stroke-width="12" opacity="0.8">
      <line x1="0" y1="0" x2="-100" y2="-80"/>
      <line x1="0" y1="0" x2="100" y2="-80"/>
      <line x1="0" y1="0" x2="-90" y2="90"/>
      <line x1="0" y1="0" x2="90" y2="90"/>
    </g>

    <circle cx="-100" cy="-80" r="28" fill="#8b5cf6"/>
    <circle cx="100" cy="-80" r="28" fill="#6366f1"/>
    <circle cx="-90" cy="90" r="24" fill="#3b82f6"/>
    <circle cx="90" cy="90" r="24" fill="#a855f7"/>
  </g>
</svg>